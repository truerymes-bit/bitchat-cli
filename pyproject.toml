[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitchat-cli"
dynamic = ["version"]
description = "Fork of bitchat-cli with Noise-encrypted DMs, out-of-band peer verification, and BlueZ transport fixes."
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Abhin", email = "dearabhin@gmail.com" }]
keywords = ["bitchat", "bluetooth", "ble", "mesh", "chat", "p2p", "decentralized", "cli", "noise", "encryption"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Networking",
]
dependencies = [
    "cryptography>=3.4.8",
    "prompt-toolkit>=3.0.43",
    "noiseprotocol>=0.3.1",
]

[project.urls]
Homepage = "https://github.com/truerymes-bit/bitchat-cli"
Repository = "https://github.com/truerymes-bit/bitchat-cli"
Issues = "https://github.com/truerymes-bit/bitchat-cli/issues"

[project.scripts]
bitchat-cli = "bitchat_cli.main:main"
bitchat = "bitchat_cli.main:main"

[tool.setuptools]
packages = ["bitchat_cli", "bitchat_cli.sync"]

[tool.setuptools.dynamic]
version = { attr = "bitchat_cli.__version__" }
